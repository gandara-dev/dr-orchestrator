name: Synthetic Site Recovery
version: 1
description: Fictional dependency-ordered recovery example for simulation and lab use.
steps:
  - id: start-ad
    name: Start Active Directory VMs
    provider: VMware
    action: StartVM
    parameters:
      vmNames:
        - dr-ad01
        - dr-ad02

  - id: check-ad-ldap
    name: Check LDAP on the primary domain controller
    provider: Windows
    action: TestTcpPort
    dependsOn: [start-ad]
    parameters:
      computerName: dr-ad01.example.test
      port: 389
      timeoutSeconds: 10

  - id: start-sql
    name: Start SQL VMs
    provider: VMware
    action: StartVM
    dependsOn: [check-ad-ldap]
    parameters:
      vmNames:
        - dr-sql01

  - id: check-sql
    name: Check SQL listener
    provider: Windows
    action: TestTcpPort
    dependsOn: [start-sql]
    parameters:
      computerName: dr-sql01.example.test
      port: 1433
      timeoutSeconds: 15

  - id: start-delivery-controllers
    name: Start Citrix Delivery Controller VMs
    provider: VMware
    action: StartVM
    dependsOn: [check-sql]
    parameters:
      vmNames:
        - dr-ddc01
        - dr-ddc02

  - id: check-delivery-controller
    name: Check Delivery Controller web endpoint
    provider: Windows
    action: TestTcpPort
    dependsOn: [start-delivery-controllers]
    parameters:
      computerName: dr-ddc01.example.test
      port: 80
      timeoutSeconds: 15

  - id: start-storefront
    name: Start StoreFront VMs
    provider: VMware
    action: StartVM
    dependsOn: [check-delivery-controller]
    parameters:
      vmNames:
        - dr-sf01
        - dr-sf02

  - id: check-storefront
    name: Check StoreFront HTTPS endpoint
    provider: Windows
    action: TestHttp
    dependsOn: [start-storefront]
    parameters:
      uri: https://dr-storefront.example.test/
      timeoutSeconds: 15

  - id: start-vdas
    name: Start VDA VMs
    provider: VMware
    action: StartVM
    dependsOn: [check-storefront]
    parameters:
      vmNames:
        - dr-vda01
        - dr-vda02